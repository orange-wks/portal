<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一年の札</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main class="board">
    <header class="timeline-wrap">
      <span class="place-mark"></span>
      <nav id="timeline" class="timeline" aria-label="年表"></nav>
    </header>
    <section class="play-area">
      <article id="event" class="event-card" aria-live="polite"></article>
    </section>
    <nav id="field-tabs" class="field-tabs" aria-label="場の札の区分"></nav>
    <section id="tableau" class="tableau" aria-label="置き札の場"></section>
  </main>
  <aside id="detail" class="detail-panel" aria-label="札の詳しいこと" hidden></aside>
</body>
</html>
